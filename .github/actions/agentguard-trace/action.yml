name: AgentGuard trace check
description: Replay and analyze a frozen AgentGuard Execution Trace JSON file
inputs:
  trace:
    description: Repository-relative path to an Execution Trace JSON file
    required: true
  command:
    description: CLI command to run (replay, analyze, or run)
    required: false
    default: run
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
outputs:
  report-path:
    description: Absolute path to the JSON report written by the action
    value: ${{ steps.trace-check.outputs.report-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install AgentGuard and its declared dependencies
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
      run: |
        python -m pip install -e "$ACTION_ROOT" -r "$ACTION_ROOT/requirements.txt"
    - name: Replay or analyze trace
      id: trace-check
      shell: bash
      env:
        TRACE_PATH: ${{ inputs.trace }}
        TRACE_COMMAND: ${{ inputs.command }}
        REPORT_PATH: ${{ runner.temp }}/agentguard-trace-report.json
      run: |
        python -m agentguard.cli "$TRACE_COMMAND" "$TRACE_PATH" --output "$REPORT_PATH"
        echo "report-path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
