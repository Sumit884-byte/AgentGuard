name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
      - name: Exercise the composite trace action
        uses: ./.github/actions/agentguard-trace
        with:
          trace: tests/fixtures/execution_traces/micro_refund_split_01.json
          command: run
          python-version: ${{ matrix.python-version }}
