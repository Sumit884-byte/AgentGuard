
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Agent policy evaluation and financial exposure demo"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.scripts]
agentguard = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["evaluator", "simulator"]
