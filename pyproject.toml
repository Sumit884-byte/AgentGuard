[project]
name = "agentguard"
version = "0.1.0"
description = "Adversarial testing harness for billing support agents"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "google-genai>=1.65",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Claude API (run with -m live)"]
