[project]
name = "agentguard"
version = "0.1.0"
description = "Adversarial testing harness for billing support agents"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "google-genai>=1.65",
]

[project.scripts]
agentguard-spending-demo = "agentguard.spending_demo:main"
agentguard = "agentguard.cli:main"

[project.optional-dependencies]
# Strands agent and contract v2 phase 2 servers (agentguard.strands_agent)
agent = ["strands-agents>=1.62,<2", "mcp>=2.1,<3", "uvicorn>=0.31", "httpx>=0.28", "openai>=1.40"]
dev = ["pytest>=8", "agentguard[agent]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real model API (run with -m live)"]
